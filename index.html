<!--This declares that the document is html5-->
<!DOCTYPE html>
<html>

<head>
	
  <title>Snack Time</title>
  
<!--Sets the favicon image to favicon.png-->
  <link rel="icon" type="image/png" href="favicon.png">
  
<!--Where the CSS styles are located-->
<!--margin 0 allows for the removal of the default margins-->
<!--display, justify-content, align-items, all allow for the allignment of the text-->
<!--transition + hover allow for animation-->
  <style>
    body {
      background-color: #fefefe;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }
    .time-container {
      text-align: center;
      background-color: #fff;
      border: 4px solid #ff9800;
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease-in-out;
    }
    .time-container:hover {
      transform: scale(1.02);
    }
    h1 {
      margin-top: 0;
      color: #ff9800;
      font-size: 2.5rem;
    }
    #clock {
      font-size: 4rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    button {
      padding: 0.8rem 1.5rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #ff9800;
      color: white;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #e68900;
    }
	a.btn {
	  display: inline-block;
	  padding: 0.8rem 1.5rem;
	  font-size: 1.2rem;
	  border: none;
	  border-radius: 10px;
	  cursor: pointer;
	  background-color: #ff9800;
	  color: white;
	  text-decoration: none;
	  transition: background-color 0.2s ease;
	}
	a.btn:hover {
	  background-color: #e68900;
	}
	.quote {
	  font-style: italic;
	  color: #555;
	  font-size: 1.1rem;
	  margin-bottom: 1rem;
	}
	.quote span {
	  display: block;
	  font-size: 0.9rem;
	  color: #888;
	  margin-top: 0.3rem;
	}
	.footer {
	  position: absolute;
	  bottom: 10px;
	  width: 100%;
	  text-align: center;
	  font-size: 0.9rem;
	  color: #999;
	  font-style: italic;
	}
	
  </style>
  
</head>

<body>
	
  <div class="time-container">
    <p class="quote">"To eat or not to eat, that is the question."<br><span>- Some Random Dude Most Likely</span></p>
    <h1>Current Time</h1>
    <div id="clock"></div>
    <div class="buttons">

<!--Both of these will link to other pages-->
      <a href="name.html" class="btn">I am hungry</a>
      <a href="full.html" class="btn">I am full</a>
	
    </div>
  </div>

<footer class="footer">Created by Dante M</footer>

<script>

    function updateClock() {
		const now = new Date(); //Gets the current date and time
		const time = now.toLocaleTimeString(); //Fortmats it so it is readable
      document.getElementById("clock").textContent = time;
    }

    setInterval(updateClock, 1000); //Every 1 second
    updateClock();

</script>
	
</body>

</html>
